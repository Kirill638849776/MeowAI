name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  # 1. Проверка синтаксиса Python
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: |
          python -m py_compile meowai.py
          echo "✅ Синтаксис в порядке"

  # 2. Линтер flake8
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 meowai.py --count --select=E9,F63,F7,F82 --show-source --statistics

  # 3. Проверка на нецензурную лексику и угрозы
  content-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan for profanity and threats
        run: |
          python - <<'EOF'
          import os
          import sys

          BANNED = [
              'fuck', 'shit', 'bitch', 'asshole', 'damn',
              'блядь', 'блять', 'хуй', 'пиздец', 'ебать', 'сука',
              'убью', 'убей', 'kill you', 'i will kill',
              'hate you', 'ненавижу тебя'
          ]

          ALLOWED_EXT = ('.py', '.md', '.txt', '.yml', '.yaml', '.json', '.cfg', '.toml')

          violations = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', '.github', 'dist', 'build', '__pycache__')]
              for f in files:
                  if not f.endswith(ALLOWED_EXT):
                      continue
                  path = os.path.join(root, f)
                  try:
                      with open(path, 'r', encoding='utf-8', errors='ignore') as fh:
                          content = fh.read().lower()
                  except Exception:
                      continue
                  for word in BANNED:
                      if word in content:
                          violations.append(f'{path}: содержит "{word}"')

          if violations:
              print('❌ Найдены нарушения:')
              for v in violations:
                  print(' -', v)
              sys.exit(1)
          else:
              print('✅ Нецензурной лексики и угроз не найдено')
          EOF

  # 4. Проверка уязвимостей Python (Bandit) - смягчённая
  security-scan:
    runs-on: ubuntu-latest
    continue-on-error: true  # не блокирует мердж
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: |
          bandit meowai.py -lll || echo "⚠️ Bandit нашёл замечания, но это не блокирует сборку"

  # 5. Проверка на утечку секретов (Gitleaks)
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
